<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About - Alumni Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --bg: #0b0f19;
      --card-bg: rgba(23, 32, 53, 0.8);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 {
      top: 10%;
      left: 15%;
      width: 400px;
      height: 400px;
      background: rgba(99, 102, 241, 0.2);
    }
    .glow-2 {
      bottom: 10%;
      right: 15%;
      width: 400px;
      height: 400px;
      background: rgba(6, 182, 212, 0.15);
    }

    .about-card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .tag {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      padding: 5px 14px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 1rem;
    }

    .info-box {
      background: rgba(11, 15, 25, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      text-align: left;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
    }

    .info-label {
      color: var(--text-muted);
    }

    .info-val {
      color: #38bdf8;
      font-weight: 600;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 0.95rem;
      transition: transform 0.15s, opacity 0.2s;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }

    .btn:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="about-card">
    <span class="tag">🚧 Temporary About Page</span>
    <h1>Hakkında (About)</h1>
    <p>Bu sayfa <strong>Alumni</strong> web projesinin geçici hakkında sayfasıdır. Proje geliştirme ve rota yapılandırma aşamasındadır.</p>
    
    <div class="info-box">
      <div class="info-row">
        <span class="info-label">Proje Adı:</span>
        <span class="info-val">Alumni Web Project</span>
      </div>
      <div class="info-row">
        <span class="info-label">Ders / Modül:</span>
        <span class="info-val">Web Programming</span>
      </div>
      <div class="info-row">
        <span class="info-label">Durum:</span>
        <span class="info-val">Aktif / Geliştiriliyor</span>
      </div>
    </div>

    <a href="/Alumni" class="btn">← Ana Sayfaya Dön</a>
  </div>
</body>
</html>
