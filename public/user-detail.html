<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kullanıcı Detayı - Alumni Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --bg: #0b0f19;
      --card-bg: rgba(23, 32, 53, 0.8);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 {
      top: 10%;
      left: 15%;
      width: 400px;
      height: 400px;
      background: rgba(99, 102, 241, 0.2);
    }
    .glow-2 {
      bottom: 10%;
      right: 15%;
      width: 400px;
      height: 400px;
      background: rgba(6, 182, 212, 0.15);
    }

    .detail-card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tag {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(11, 15, 25, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.92rem;
    }

    .info-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .info-label {
      color: var(--text-muted);
    }

    .info-value {
      color: #fff;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-edit {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      flex: 1;
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 100%;
    }

    .btn-back:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="detail-card">
    <div class="header-row">
      <span class="tag">Kullanıcı Detayı</span>
      <span style="color: var(--text-muted); font-size: 0.85rem;">ID: #{{USER_ID}}</span>
    </div>

    <h1>{{USER_NAME}}</h1>

    <div class="info-list">
      <div class="info-item">
        <span class="info-label">E-posta:</span>
        <span class="info-value" style="color: var(--accent);">{{USER_EMAIL}}</span>
      </div>
      <div class="info-item">
        <span class="info-label">Kayıt Tarihi:</span>
        <span class="info-value">{{USER_CREATED}}</span>
      </div>
      {{USER_UPDATED_SECTION}}
    </div>

    <div class="actions">
      <a href="/users/{{USER_ID}}/edit" class="btn btn-edit">✏️ Düzenle</a>
      <form method="POST" action="/users/{{USER_ID}}/delete" style="display: inline;" onsubmit="return confirm('Bu kullanıcıyı silmek istediğinize emin misiniz?');">
        <button type="submit" class="btn btn-delete">🗑️ Sil</button>
      </form>
      <a href="/users" class="btn btn-back">← Kullanıcı Listesine Dön</a>
    </div>
  </div>
</body>
</html>
