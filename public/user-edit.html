<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kullanıcı Düzenle - Alumni Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --bg: #0b0f19;
      --card-bg: rgba(23, 32, 53, 0.8);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: #111827;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 {
      top: 10%;
      left: 15%;
      width: 400px;
      height: 400px;
      background: rgba(99, 102, 241, 0.2);
    }
    .glow-2 {
      bottom: 10%;
      right: 15%;
      width: 400px;
      height: 400px;
      background: rgba(6, 182, 212, 0.15);
    }

    .edit-card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .tag {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      align-self: flex-start;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: transform 0.1s, opacity 0.2s;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }

    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-cancel {
      display: block;
      text-align: center;
      padding: 10px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 4px;
    }

    .btn-cancel:hover {
      color: #fff;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="edit-card">
    <span class="tag">Kullanıcı Düzenleme</span>
    <h1>Kullanıcıyı Güncelle</h1>

    <!-- ERROR_BANNER -->

    <form method="POST" action="/users/{{USER_ID}}/update">
      <div class="form-group">
        <label for="name">Ad Soyad</label>
        <input type="text" id="name" name="name" value="{{USER_NAME}}" required />
      </div>

      <div class="form-group" style="margin-top: 14px;">
        <label for="email">E-posta Adresi</label>
        <input type="email" id="email" name="email" value="{{USER_EMAIL}}" required />
      </div>

      <div class="form-group" style="margin-top: 14px;">
        <label for="password">Yeni Şifre (Değiştirmek istemiyorsanız boş bırakın)</label>
        <input type="password" id="password" name="password" placeholder="Yeni şifre..." />
      </div>

      <button type="submit" class="btn-submit">Değişiklikleri Kaydet</button>
      <a href="/users" class="btn-cancel">İptal</a>
    </form>
  </div>
</body>
</html>
